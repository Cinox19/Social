name: Publish GTA Timers 0.14.24

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprnortheu.oaiusercontent.com/files/00000000-0f74-81f4-b208-cdc5ae204c23/raw?se=2026-09-28T09%3A59%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=5d773f54-112c-52a7-9743-dd9e410f8570&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T07%3A35%3A37Z&ske=2026-09-29T07%3A35%3A37Z&sks=b&skv=2026-02-06&sig=5UMJoWYSmqFO6PMetsnbBDQRqHGy1PiYiXdXkCq%2BCXo%3D"             -o /tmp/gta-timers-01424.zip
          unzip -o /tmp/gta-timers-01424.zip -d /tmp/gta-timers-01424
          cp /tmp/gta-timers-01424/GTA-Timers-v0.14.24.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.24",
            "versionCode": 88,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Events V2.2 : badges visibles sur les cartes business\n- Badges bonus dans Gérer les activités\n- Badges bonus dans Gérer les business motards\n- Mapping GTA+ cocaïne vers le business correspondant"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.24"
          git push origin HEAD:gta-timers-updates
