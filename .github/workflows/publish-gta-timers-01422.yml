name: Publish GTA Timers 0.14.45

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5044-8210-bf5b-e0afaa5a7c98/raw?se=2026-10-04T08%3A32%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=41852466-c916-5081-a730-f3447e3f6a62&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T06%3A45%3A17Z&ske=2026-10-05T06%3A45%3A17Z&sks=b&skv=2026-02-06&sig=csNNR7arJLymj%2Bcl5/3pnaZNTBsAmEHVcz/5CyZtkis%3D"             -o /tmp/gta-timers-01445.zip
          unzip -o /tmp/gta-timers-01445.zip -d /tmp/gta-timers-01445
          cp /tmp/gta-timers-01445/GTA-Timers-v0.14.45.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.45",
            "versionCode": 109,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Page Activités : ajout Station de lavage Hands On et Bureau de caution\n- Activités et coffres associés ajoutés au catalogue\n- Le bouton Ajouter à l’accueil devient FAIT + montant ; l’ajout/retrait de l’Accueil se fait par appui long sur la carte\n- Les activités à gain variable demandent le montant réel au moment de valider\n- Le temps écoulé depuis la dernière livraison moto se fige correctement pendant la pause"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.45"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.45
