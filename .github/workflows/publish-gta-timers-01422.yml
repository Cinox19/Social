name: Publish GTA Timers 0.14.39

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1a54-8210-9a06-e764507164f6/raw?se=2026-10-01T10%3A20%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=162d07c1-54ef-5942-8042-b55c7ff88ec1&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A51%3A14Z&ske=2026-10-02T09%3A51%3A14Z&sks=b&skv=2026-02-06&sig=997pBKj4F2iTuxojVeG6rLOTMOEI%2BAkvkH16DLmnh44%3D"             -o /tmp/gta-timers-01439.zip
          unzip -o /tmp/gta-timers-01439.zip -d /tmp/gta-timers-01439
          cp /tmp/gta-timers-01439/GTA-Timers-v0.14.39.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.39",
            "versionCode": 103,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Correction définitive de la miniature Kortz Center\n- Ressource image remplacée par un JPEG 256x256 propre issu de l’image originale\n- Conservation de la surveillance PS5 sans notification permanente lorsque GTA Timers est au premier plan"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.39"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.39
