name: Publish GTA Timers 0.14.23

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01423.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-956c-8210-9687-e4a4ce0fa70f/raw?se=2026-09-28T08%3A19%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=f64e4838-82a8-5f60-ab2e-40597709351a&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A37%3A20Z&ske=2026-09-29T05%3A37%3A20Z&sks=b&skv=2026-02-06&sig=3vogld1s3x4UYui%2BEz2EOfP4gY7gUreAebkZCz1X1hg%3D"             -o /tmp/gta-timers-01423.zip
          unzip -o /tmp/gta-timers-01423.zip -d /tmp/gta-timers-01423
          cp /tmp/gta-timers-01423/GTA-Timers-v0.14.23.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.23",
            "versionCode": 87,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Events V2.1 : badges de bonus contextuels sur les activités\n- Actualisation silencieuse du flux Events au démarrage\n- Nouvelle section À FARMER CETTE SEMAINE\n- Préparation du mapping Events ↔ activités pour les futurs calculs automatiques"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.23"
          git push origin HEAD:gta-timers-updates
