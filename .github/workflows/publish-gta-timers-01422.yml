name: Publish GTA Timers 0.14.53

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01453.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprnortheu.oaiusercontent.com/files/00000000-8584-81f4-9483-9018146e7be7/raw?se=2026-10-07T11%3A01%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=bccd30a3-b357-58ed-9fa1-90a53889bdcf&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T07%3A41%3A16Z&ske=2026-10-08T07%3A41%3A16Z&sks=b&skv=2026-02-06&sig=yJCLtGWontRTCG27fbLbABSEusdvbgke/zkO3tGO1Qk%3D"             -o /tmp/gta-timers-01453.zip
          unzip -o /tmp/gta-timers-01453.zip -d /tmp/gta-timers-01453
          cp /tmp/gta-timers-01453/GTA-Timers-v0.14.53.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.53",
            "versionCode": 117,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Ajout du coffre Bureau de caution\n- Encaissement manuel avec saisie du montant\n- Le montant est ajouté automatiquement dans Gains"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.53"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.53
