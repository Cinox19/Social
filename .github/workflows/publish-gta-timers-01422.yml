name: Publish GTA Timers 0.14.22

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9d50-8210-bba8-5ac3a24652dc/raw?se=2026-09-28T07%3A55%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=968006b5-b53d-53cd-b879-69f37afff63d&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A11%3A26Z&ske=2026-09-29T06%3A11%3A26Z&sks=b&skv=2026-02-06&sig=is%2BVQl4uIPP3yshuqL698pmTrG4iIqjBHuWcFpXFwIA%3D"             -o /tmp/gta-timers-01422.zip
          unzip -o /tmp/gta-timers-01422.zip -d /tmp/gta-timers-01422
          cp /tmp/gta-timers-01422/GTA-Timers-v0.14.22.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.22",
            "versionCode": 86,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Nouveau ruban d'accueil 75% Events / 25% GTA+\n- Nouveau bouton GTA+ dédié sur l'accueil\n- Nouvelle page GTA+ séparée pour les avantages et événements réservés aux abonnés\n- La page Events classique n'affiche plus la section GTA+ en doublon"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.22"
          git push origin HEAD:gta-timers-updates
