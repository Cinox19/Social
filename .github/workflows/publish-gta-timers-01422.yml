name: Publish GTA Timers 0.14.34

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprukwest.oaiusercontent.com/files/00000000-70ec-8243-ab82-d59907092c0d/raw?se=2026-09-30T06%3A56%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=ad3c205c-ca31-5717-87fb-4a2d1310b35f&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T04%3A42%3A41Z&ske=2026-10-01T04%3A42%3A41Z&sks=b&skv=2026-02-06&sig=nwYGbQUkxISUwe2qxygLwfVNPjBzCFFg70VZ6u3PJgU%3D"             -o /tmp/gta-timers-01434.zip
          unzip -o /tmp/gta-timers-01434.zip -d /tmp/gta-timers-01434
          cp /tmp/gta-timers-01434/GTA-Timers-v0.14.34.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.34",
            "versionCode": 98,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Pause intelligente : option désactivée par défaut\n- Alerte après 100 pas consécutifs (seuil réglable 50, 100, 150 ou 200 pas)\n- Mise en pause automatique de GTA Timers et rappel pour vérifier la session PS5\n- Remise à zéro du compteur après 2 minutes sans nouveau pas\n- Détection des pas en arrière-plan sans GPS ni historique de déplacement"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.34"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.34
