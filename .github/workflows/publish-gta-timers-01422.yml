name: Publish GTA Timers 0.14.35

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3348-8210-b949-aca6f65d02ab/raw?se=2026-09-30T17%3A42%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=7631ab25-74a1-517d-ada6-ededb7833b95&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T11%3A57%3A43Z&ske=2026-10-01T11%3A57%3A43Z&sks=b&skv=2026-02-06&sig=0eNIwD90SJForucUMk2e1foEvTJYCiovaGW2C8foagg%3D"             -o /tmp/gta-timers-01435.zip
          unzip -o /tmp/gta-timers-01435.zip -d /tmp/gta-timers-01435
          cp /tmp/gta-timers-01435/GTA-Timers-v0.14.35.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.35",
            "versionCode": 99,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Ajout du Braquage du Kortz Center dans la section Braquage\n- Chronos Préparations et Finale comme les autres braquages\n- Enregistrement du gain réel et ajout automatique dans Gains\n- Kortz Center ajouté aux Stats et à l’historique des braquages\n- Miniature Kortz Center ajoutée dans Braquage, Gains et Calendrier"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.35"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.35
