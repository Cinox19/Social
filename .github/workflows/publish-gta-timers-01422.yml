name: Publish GTA Timers 0.14.46

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprnortheu.oaiusercontent.com/files/00000000-3b88-81f4-ba64-34855c9c2db2/raw?se=2026-10-04T08%3A40%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=f87006bf-dd2d-536d-9732-2efc487eba2f&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T17%3A56%3A49Z&ske=2026-10-04T17%3A56%3A49Z&sks=b&skv=2026-02-06&sig=rmngGN%2BHCKoatSXFrZMEsStlxv/YzWupIgBZTlgoW10%3D"             -o /tmp/gta-timers-01446.zip
          unzip -o /tmp/gta-timers-01446.zip -d /tmp/gta-timers-01446
          cp /tmp/gta-timers-01446/GTA-Timers-v0.14.46.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.46",
            "versionCode": 110,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Page Activités : une étoile verte apparaît en haut à gauche des activités déjà ajoutées à l’Accueil\n- L’étoile se met à jour immédiatement après un appui long pour ajouter ou retirer l’activité"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.45"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.45
