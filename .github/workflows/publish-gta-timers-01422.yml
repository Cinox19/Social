name: Publish GTA Timers 0.14.48

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fa2c-8210-8117-defe1baf7f18/raw?se=2026-10-04T09%3A03%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=21df942e-5baf-556e-890c-a5a819fe39cb&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T08%3A18%3A27Z&ske=2026-10-05T08%3A18%3A27Z&sks=b&skv=2026-02-06&sig=BxWTZtn9txSN4ex7PAWQDgPlHWD6CqvTQdQwnj%2B03SM%3D"             -o /tmp/gta-timers-01448.zip
          unzip -o /tmp/gta-timers-01448.zip -d /tmp/gta-timers-01448
          cp /tmp/gta-timers-01448/GTA-Timers-v0.14.48.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.48",
            "versionCode": 112,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Page Activités : les catégories affichent maintenant un badge avant ouverture lorsqu’une activité contient un événement ou un boost actif\n- Badges verts pour les bonus x2/x3 classiques\n- Badges bleus pour les avantages GTA+\n- Plusieurs boosts d’une même catégorie sont regroupés de façon compacte"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.48"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.48
