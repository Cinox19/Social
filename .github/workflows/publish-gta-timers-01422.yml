name: Publish GTA Timers 0.14.37

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprnortheu.oaiusercontent.com/files/00000000-7c94-81f4-a664-7b823d7adbf9/raw?se=2026-10-01T06%3A18%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=ddfcef06-44f0-5cba-9b9f-d1a7616467ed&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T03%3A56%3A35Z&ske=2026-10-02T03%3A56%3A35Z&sks=b&skv=2026-02-06&sig=LZJHTwhvopc5fR3MM0%2BYkqfJkPvAml/54pUWIwxUe1c%3D"             -o /tmp/gta-timers-01437.zip
          unzip -o /tmp/gta-timers-01437.zip -d /tmp/gta-timers-01437
          cp /tmp/gta-timers-01437/GTA-Timers-v0.14.37.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.37",
            "versionCode": 101,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Suppression complète de la notification permanente Surveillance PS5\n- Le ping PS5 reste actif toutes les 10 secondes tant que GTA Timers est ouvert\n- Aucune notification si les pings réussissent\n- Notification uniquement après 3 échecs consécutifs et pause automatique\n- L’ancien service Android de surveillance a été retiré"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.37"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.37
