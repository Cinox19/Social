name: Publish GTA Timers 0.14.44

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b748-8210-83f1-784fa7ecff62/raw?se=2026-10-03T07%3A05%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=dcb5e8e5-180a-5f79-817b-f8773c8b985b&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T19%3A56%3A39Z&ske=2026-10-03T19%3A56%3A39Z&sks=b&skv=2026-02-06&sig=1FVg/Cn9QxQ65QIN4f/7pzSpXA3xVY1l3v7DqUQeePU%3D"             -o /tmp/gta-timers-01444.zip
          unzip -o /tmp/gta-timers-01444.zip -d /tmp/gta-timers-01444
          cp /tmp/gta-timers-01444/GTA-Timers-v0.14.44.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.44",
            "versionCode": 108,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Synchronisation robuste Pause/Reprise entre le widget et l’application\n- Toute action depuis le widget publie immédiatement le nouvel état partagé\n- L’application se resynchronise automatiquement au retour au premier plan\n- La page courante est conservée après synchronisation\n- Le widget est aussi actualisé après une pause automatique PS5"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.44"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.44
