name: Publish GTA Timers 0.14.33

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprukwest.oaiusercontent.com/files/00000000-bdd8-8243-8aa1-70364cc900ab/raw?se=2026-09-29T16%3A31%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=b73825fa-ee30-5cc5-90e9-9c2f9d978ee8&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A18%3A32Z&ske=2026-09-30T06%3A18%3A32Z&sks=b&skv=2026-02-06&sig=GATJvFL96JeXQQBAwVnPTX7ilcV49xEsLC5YWiHSUZc%3D"             -o /tmp/gta-timers-01433.zip
          unzip -o /tmp/gta-timers-01433.zip -d /tmp/gta-timers-01433
          cp /tmp/gta-timers-01433/GTA-Timers-v0.14.33.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.33",
            "versionCode": 97,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Nouvelle section Achats en violet sur la page Gains\n- Les achats apparaissent dans la journée sans modifier le NET journalier\n- Les achats sont déduits du TOTAL NET global\n- Historique des achats dédié\n- Réappro matières premières du labo d’acide : 10 min\n- Logos Cocaïne, Meth, Faux billets, Cannabis, Faux documents et DJ dans Gains/Calendrier\n- Appui long sur la popularité de la boîte de nuit pour la régler manuellement"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.33"
          git push origin HEAD:gta-timers-updates

