name: Publish GTA Timers 0.14.34

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-a8d8-8210-a8c4-c08cfb33b294/raw?se=2026-09-30T07%3A46%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=0d6d781f-2f4c-5e0e-8c4c-4899eefd1ee6&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T06%3A05%3A36Z&ske=2026-10-01T06%3A05%3A36Z&sks=b&skv=2026-02-06&sig=VyFSlM7DphJHoRQMRwrr24HGWOpzXNPxSw/vokSnK6Q%3D"             -o /tmp/gta-timers-01434.zip
          unzip -o /tmp/gta-timers-01434.zip -d /tmp/gta-timers-01434
          cp /tmp/gta-timers-01434/GTA-Timers-v0.14.34.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.34",
            "versionCode": 98,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Nouvelle surveillance réseau PS5 optionnelle (ON/OFF)\n- Configuration et test ping de l’adresse IP locale de la console\n- Vérification automatique toutes les 10 secondes pendant la session active\n- Pause automatique et notification après 3 échecs consécutifs\n- Reprise manuelle ; aucun GPS ni autorisation Activité physique\n- Remplace intégralement l’ancienne détection par les pas"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.34"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.34
