name: Publish GTA Timers 0.14.50

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8264-8210-9f05-22c184864fa5/raw?se=2026-10-05T15%3A15%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=a06d3b1c-84ea-5385-91da-568c23ad4f48&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T06%3A03%3A03Z&ske=2026-10-06T06%3A03%3A03Z&sks=b&skv=2026-02-06&sig=yhtMO4xEEaK5Qdsf1fkAJJT28qCqSAgtplZvgSbpkls%3D"             -o /tmp/gta-timers-01450.zip
          unzip -o /tmp/gta-timers-01450.zip -d /tmp/gta-timers-01450
          cp /tmp/gta-timers-01450/GTA-Timers-v0.14.50.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.50",
            "versionCode": 114,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Ajout du braquage Oscar Guzman Flies Again\n- Chrono PRÉPARATION + FINALE comme les autres braquages\n- Ajout d’Oscar Guzman dans l’historique et les statistiques"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.50"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.50
