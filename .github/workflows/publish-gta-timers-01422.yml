name: Publish GTA Timers 0.14.30

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-6504-8210-8560-37f2a3ad67ed/raw?se=2026-09-28T16%3A46%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=1a99f46d-6f81-5eea-b8e9-b5ee6b157866&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A32%3A47Z&ske=2026-09-29T00%3A32%3A47Z&sks=b&skv=2026-02-06&sig=%2BOQMEjqgpLzr0Wn0ksaW6ZSZ2phmyP4ariNFNE5gjV0%3D"             -o /tmp/gta-timers-01430.zip
          unzip -o /tmp/gta-timers-01430.zip -d /tmp/gta-timers-01430
          cp /tmp/gta-timers-01430/GTA-Timers-v0.14.30.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.30",
            "versionCode": 94,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Multiplicateurs Events automatiques\n- Livraison moto passe automatiquement en x3 pendant le bonus GTA+\n- Le multiplicateur AUTO prend la priorité pendant l’événement\n- Retour automatique au multiplicateur manuel après expiration"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.30"
          git push origin HEAD:gta-timers-updates
