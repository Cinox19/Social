name: Publish GTA Timers 0.14.31

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprukwest.oaiusercontent.com/files/00000000-c17c-8243-8fcb-e356ab389566/raw?se=2026-09-29T11%3A53%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=3e3bdd23-d804-5213-84f0-d3c65df689ab&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A34%3A35Z&ske=2026-09-30T06%3A34%3A35Z&sks=b&skv=2026-02-06&sig=3ENTpj%2BSvSPaaMYz0JSvKNcAqJqg8t9CYUyetOmdv5E%3D"             -o /tmp/gta-timers-01431.zip
          unzip -o /tmp/gta-timers-01431.zip -d /tmp/gta-timers-01431
          cp /tmp/gta-timers-01431/GTA-Timers-v0.14.31.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.31",
            "versionCode": 95,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Appui long sur GTA+ : choisir si les avantages GTA+ influencent les cartes\n- AUTO ON : badges et multiplicateurs GTA+ actifs\n- AUTO OFF : page GTA+ consultable mais sans impact sur les cartes et gains\n- Le choix est mémorisé"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.31"
          git push origin HEAD:gta-timers-updates

# trigger publish 0.14.31
