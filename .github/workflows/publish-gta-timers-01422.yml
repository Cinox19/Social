name: Publish GTA Timers 0.14.26

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-gta-timers-01422.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: gta-timers-updates

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1cbc-8210-92fb-85621aea93b7/raw?se=2026-09-28T11%3A38%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=f3a90b54-aa57-5ad3-8429-b96915c74ddb&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A53%3A27Z&ske=2026-09-29T05%3A53%3A27Z&sks=b&skv=2026-02-06&sig=8XtO9AHeWlPXcaEHvHMllhKGeQWHp8Wvu0oWijJMkgo%3D"             -o /tmp/gta-timers-01426.zip
          unzip -o /tmp/gta-timers-01426.zip -d /tmp/gta-timers-01426
          cp /tmp/gta-timers-01426/GTA-Timers-v0.14.26.apk gta-timers/latest.apk

      - name: Update manifest
        shell: bash
        run: |
          SHA=$(sha256sum gta-timers/latest.apk | awk '{print $1}')
          cat > gta-timers/latest.json <<EOF
          {
            "versionName": "0.14.26",
            "versionCode": 90,
            "apkUrl": "https://raw.githubusercontent.com/Cinox19/Social/gta-timers-updates/gta-timers/latest.apk",
            "sha256": "$SHA",
            "notes": "- Stats braquages : nouveau filtre Aujourd’hui\n- Affiche uniquement les braquages terminés depuis minuit\n- RUNS, temps, gains, $/h, prépa et finale recalculés sur la journée"
          }
          EOF

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-timers/latest.apk gta-timers/latest.json
          git commit -m "publish: GTA Timers v0.14.26"
          git push origin HEAD:gta-timers-updates
